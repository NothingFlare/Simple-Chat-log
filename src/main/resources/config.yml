# =======================================================
#               SimpleChatLog Configuration
# =======================================================

# Язык сообщений плагина:
# Поддерживаются: en, ru, zh, de, fr, es, pt, ja, uk, it, pl, tr, ko
language: "ru"

# Выбор типа базы данных: 'sqlite' или 'mysql'
database:
  type: "mysql" # sqlite или mysql

  # Настройки SQLite (локальный файл базы данных)
  sqlite:
    file: "chat_logs.db"

  # Настройки MySQL
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft_chat"
    username: "root"
    password: "root"
    pool-size: 10
    connection-timeout: 30000

# Настройки работы плагина
settings:
  # Записывать сообщения ТОЛЬКО в базу данных и скрывать их из консоли сервера
  # Если true: чат игроков не засоряет консоль сервера, но админы могут включить
  # просмотр в реальном времени командой /chatlog live (или в консоли: chatlog live)
  hide-chat-from-console: true

  # Записывать ли отменённые сообщения.
  # Рекомендуется 'true': многие плагины на чат (OCDChat, Chatty, TownyChat и др.)
  # всегда отменяют стандартное событие Bukkit, чтобы разослать сообщение вручную с префиксами и дистанцией.
  log-cancelled: true

  # Режим слушателя чата:
  # 'auto' - автоматически определяет Paper или Spigot (рекомендуется)
  # 'paper' - принудительно использовать AsyncChatEvent (Paper 1.16.5+)
  # 'spigot' - принудительно использовать классический AsyncPlayerChatEvent
  chat-event: "auto"

  # Настройки асинхронной очереди и пакетной записи
  queue:
    # Интервал сброса очереди в базу данных (в миллисекундах)
    # По умолчанию: 1000 мс (1 секунда)
    flush-interval-ms: 1000

    # Максимальный размер пакета сообщений за одну транзакцию
    # По умолчанию: 100
    batch-size: 100
