search_not_found: "{prefix}&cNo messages found for player &b{player}&c."
search_header: "&6=== Last {count} messages from &b{player} &6==="
search_format: "&7[{date}] &8({world}, {x}, {y}, {z}) &f{player}: &e{message}"
